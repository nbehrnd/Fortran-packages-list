[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xfpm"
version = "0.1.0"
requires-python = ">=3.10"
authors = [
    { name="Beliavsky", email="38887928+Beliavsky@users.noreply.github.com" },
    { name="Norwid Behrnd", email="nbehrnd@yahoo.com" }
]
description = "check GitHub projects about Fortran to use fpm"
readme = "README.md"

license-files = ["LICENSE"]
keywords = ["Fortran", "fpm"]

# https://pypi.org/classifiers/
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "requests>=2.32.5",
    "urllib3>=2.6.3",
]

[project.optional-dependencies]
dev = [
    "black>=25.1.0",
    "build>=1.2.2.post1",
    "pytest>=8.4.1",
]

[project.urls]
homepage = "https://github.com/Beliavsky/Fortran-packages-list"
repository = "https://github.com/Beliavsky/Fortran-packages-list"
source = "https://github.com/nbehrnd/Fortran-packages-list"

[project.scripts]
xfpm = "app.xfpm:main"

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = "tests"
filterwarnings = "ignore::pytest.PytestCacheWarning"
markers = [
    "blackbox: a black-box test",
    "imported: a test which imports a function of the script",
]

